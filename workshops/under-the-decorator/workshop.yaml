name: under-the-decorator
title: Under the decorator
version: 0.1.0
description: Build a wrapt.FunctionWrapper by hand and see it is what @wrapt.decorator builds. Put one on an instance method, a class method and a static method, read the BoundFunctionWrapper that comes back through an instance with its _self_instance, _self_parent and _self_binding, and compare a descriptor written by hand. Then a wrapper pair of your own with __bound_function_wrapper__.
