gating: soft
finish: |
  You have seen what is under a wrapt decorator. `FunctionWrapper`
  is a callable proxy holding the function and your wrapper, and it
  is a descriptor: read through an instance it returns a
  `BoundFunctionWrapper` carrying `_self_instance`, `_self_parent`
  and `_self_binding`, which is how the wrapper learns what
  `instance` is for a function, an instance method, a class method
  and a static method alike. A subclass names its own bound class
  through `__bound_function_wrapper__`, so behaviour of yours can
  live on either side of the binding.

  This is the underside of **Decorators with wrapt**, whose second
  workshop, **What instance tells you**, reads the same rules from
  the decorator's side.

  Next is **A proxy that fits its target**: `AutoObjectProxy`, which
  reads its target at construction and adds the special methods that
  target has, and what that costs.

  The "Function Wrappers" and "Custom Function Wrappers" sections of
  the
  [proxies guide](https://wrapt.readthedocs.io/en/latest/wrappers.html)
  in the wrapt documentation cover what this workshop used.
