name: wrapping-what-does-not-exist-yet
title: Wrapping what does not exist yet
version: 0.1.0
description: A wrapt.LazyObjectProxy with a callback in place of a target, run once on first use and never at construction. wrapt.lazy_import over a shipped module that prints when it is imported, with sys.modules checked before and after, one attribute of a module, and the interface hint that lets a lazy proxy be callable before the import has happened.
