finish: |
  You can wrap something that is not there yet. `LazyObjectProxy`
  takes a callback and runs it the first time the proxy is used,
  never at construction and never twice. `wrapt.lazy_import` is that
  with an import for the callback, for a module or one attribute of
  it, so an expensive or circular import waits until it is needed.
  Because the proxy cannot read a target it does not have, the
  `interface` hint says what kind of thing to expect, and the
  attribute form assumes a callable.

  Next is **Holding a function weakly**: `WeakFunctionProxy`, for a
  proxy that must not keep its target alive, and the bound method
  that dies the moment it is made.

  The "Lazy Object Proxies" section of the
  [proxies guide](https://wrapt.readthedocs.io/en/latest/wrappers.html)
  in the wrapt documentation covers what this workshop used.
