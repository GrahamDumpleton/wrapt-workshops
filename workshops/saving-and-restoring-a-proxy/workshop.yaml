apiVersion: jupyterlab-workshop/v1alpha1
name: saving-and-restoring-a-proxy
title: Saving and restoring a proxy
version: 0.1.0
description: pickle.dumps, copy.copy and copy.deepcopy each refuse a proxy with NotImplementedError, because the base class cannot know what state a subclass added and declines to guess. A proxy over a dictionary with a label of its own defines __reduce__ and round trips through pickle with both intact, then __copy__ and __deepcopy__ the same way, and dill needs nothing more.
