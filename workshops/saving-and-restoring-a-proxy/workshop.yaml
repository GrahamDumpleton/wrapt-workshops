finish: |
  You can save and restore a proxy. The base class refuses pickling
  and copying on purpose, because it cannot know what a subclass
  keeps under its `_self_` names, so a subclass says how with
  `__reduce__`, `__copy__` and `__deepcopy__`, each rebuilding the
  proxy from the target and its own state. That is the `_self_`
  rule from the other end: what the proxy keeps to itself is what
  it has to save.

  That is the end of **Object proxies with wrapt**. You can stand in
  for any object, know what passes through and what does not, keep
  state of your own, intercept what you choose, and reach for the
  lazy, automatic, callable and weak proxies wrapt ships when they
  fit.

  Two other sets of workshops sit beside these in the workshop
  browser. **Decorators with wrapt** is `FunctionWrapper` from the
  decorator's side: the wrapper signature, what `instance` tells
  you, state, and the decorators wrapt bundles. **Monkey patching
  with wrapt** is where a proxy is installed into code you did not
  write, with `wrap_object` and the helpers around it.

  The "Serialising an Object Proxy" section of the
  [examples](https://wrapt.readthedocs.io/en/latest/examples.html)
  in the wrapt documentation is where the proxy on these pages comes
  from.
