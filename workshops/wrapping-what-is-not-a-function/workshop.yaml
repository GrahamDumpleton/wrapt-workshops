apiVersion: jupyterlab-workshop/v1alpha1
name: wrapping-what-is-not-a-function
title: Wrapping what is not a function
version: 0.1.0
description: A patch on a dictionary a module reads its settings from. wrapt.wrap_object with a factory of your own, a BaseObjectProxy subclass that records which keys are read, and the least you need to know about proxies to write one. A callable proxy counting calls, arguments to the factory, and the two steps beneath every wrap function, resolve_path and apply_patch.
