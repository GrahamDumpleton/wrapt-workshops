name: what-belongs-to-the-proxy
title: What belongs to the proxy
version: 0.1.0
description: An assignment through a proxy lands on the target, and unittest.mock.Mock keeps its own state by not being the target at all. The _self_ prefix for state that stays on the proxy, the two dictionaries a proxy has and __self_dict__ for reading its own, and __self_setattr__ in __init__ for an override that varies by instance, present only when the wrapped object has the method.
