finish: |
  You know where a proxy keeps what is its own. An assignment
  through a proxy lands on the target, so state the target must not
  see is named with the `_self_` prefix, which the proxy stores on
  itself. `vars()` and `__dict__` follow the target too, and
  `__self_dict__` is the proxy's own dictionary. A method on the
  proxy class is on every instance; when an override should be there
  only for some targets, `__init__` stores it on that instance with
  `__self_setattr__`, the spelling that works on every Python version
  wrapt supports.

  Next is **Intercepting special methods**: why a special method
  set on a proxy instance does nothing, and what defining it on the
  proxy class gets you.

  The "Proxy Object Attributes" section of the
  [proxies guide](https://wrapt.readthedocs.io/en/latest/wrappers.html)
  and the "Introspecting the BaseObjectProxy instance \_\_dict\_\_"
  section of the
  [known issues](https://wrapt.readthedocs.io/en/latest/issues.html)
  in the wrapt documentation cover what this workshop used.
