finish: |
  You know where the transparency stops. A proxy is a second object,
  so `is`, `id()` and `type()` say so, while `__class__` and
  everything built on it follow the target. An operator returns a
  plain value, since the result is the target's to give, and an
  in-place operator hands the new value back wrapped. And
  `BaseObjectProxy` leaves `__iter__` and `__call__` off on purpose,
  so a proxy claims only what its target can do; `ObjectProxy` keeps
  `__iter__` for code written before wrapt 2.0.0.

  Next is **What belongs to the proxy**: where an assignment through
  a proxy lands, and how a proxy keeps state of its own without the
  target seeing it.

  The "Object Proxy" and "Type Comparison" sections of the
  [proxies guide](https://wrapt.readthedocs.io/en/latest/wrappers.html)
  in the wrapt documentation cover what this workshop used.
