finish: |
  You can hold a function without keeping it alive. A bound method
  is made on each access and discarded, so a weak reference to one
  is dead at once. `WeakFunctionProxy` holds the instance and the
  underlying function weakly, rebinds them on each call, raises
  `ReferenceError` once the instance is gone and runs its callback
  when that happens, which is how a registry of callbacks drops the
  entries for objects that no longer exist.

  Next is **Saving and restoring a proxy**, the last of these
  workshops: copying and pickling a proxy, which the base class
  refuses on purpose, and the three methods a subclass defines to
  allow it.

  The `WeakFunctionProxy` entry of the
  [API reference](https://wrapt.readthedocs.io/en/latest/api.html)
  in the wrapt documentation covers what this workshop used.
