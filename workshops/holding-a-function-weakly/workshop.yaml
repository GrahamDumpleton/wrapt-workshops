title: Holding a function weakly
version: 0.1.0
description: weakref.ref on a bound method is dead at once and weakref.proxy on one raises, because a bound method is made on each access and discarded. wrapt.WeakFunctionProxy holds the instance and the function weakly and rebinds on each call, raises ReferenceError once the instance is collected and runs a callback when it goes, which builds a registry of callbacks that lets its objects go.
