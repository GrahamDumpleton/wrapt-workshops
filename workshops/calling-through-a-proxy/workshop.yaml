finish: |
  You can call through a proxy. `BaseObjectProxy` leaves `__call__`
  off so that a proxy never claims to be callable when its target
  is not, `CallableObjectProxy` adds it, and a subclass overriding
  `__call__` intercepts every call while `__name__`, the signature
  and `isinstance` all still answer for the function. `wrapt.partial`
  is a callable proxy holding bound arguments, with the same
  signature `functools.partial` reports and the function still
  underneath.

  Next is **Under the decorator**: `FunctionWrapper`, the callable
  proxy beneath every wrapt decorator, and the descriptor that binds
  it to an instance.

  The "Function Wrappers" section of the
  [proxies guide](https://wrapt.readthedocs.io/en/latest/wrappers.html)
  and the `PartialCallableObjectProxy` entry of the
  [API reference](https://wrapt.readthedocs.io/en/latest/api.html)
  in the wrapt documentation cover what this workshop used.
