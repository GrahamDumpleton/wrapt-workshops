title: Calling through a proxy
version: 0.1.0
description: A BaseObjectProxy over a function cannot be called, so wrapt.CallableObjectProxy adds __call__, and a subclass of it counts calls while still answering for the function to inspect, isinstance and __name__. Then wrapt.partial beside functools.partial, with the bound arguments removed from the signature both report and the function still underneath one of them.
