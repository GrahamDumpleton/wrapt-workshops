apiVersion: jupyterlab-workshop/v1alpha1
name: a-proxy-that-fits-its-target
title: A proxy that fits its target
version: 0.1.0
description: A list, a function and a generator each wrapped in BaseObjectProxy and refusing to iterate, be called or be resumed, then each wrapped in AutoObjectProxy and working, because it reads its target at construction and adds the special methods that target has. The cost, a class generated per instance, measured, and when each base is the right one.
authors: [Graham Dumpleton]
