name: caching-methods
title: Caching methods
version: 0.1.0
description: Put functools.lru_cache on a method and find the three problems that come with it, a shared budget, instances held alive by the cache, and a TypeError for anything unhashable. Then wrapt.lru_cache, which keeps a cache per instance, and what that means for cache_info, cache_clear and pickling.
