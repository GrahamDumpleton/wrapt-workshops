issues: https://github.com/GrahamDumpleton/wrapt-workshops/issues
tags: [python, wrapt, decorators]
duration: 15m
platforms: [linux, macos]
capabilities:
  - write-files
  - kernel-exec
  - install-packages
environment:
  requirements: requirements.txt
  kernel: workshop-caching-methods
layout: notebook
layouts:
  notebook:
    main:
      areas:
        - { name: notebook, tabs: [] }
gating: soft
finish: |
  You have seen what `functools.lru_cache` does to a method: one
  budget shared by every instance, every instance held alive through
  the cache's keys, and a `TypeError` for a class that defines
  `__eq__` without `__hash__`. `wrapt.lru_cache` keeps a cache on
  each instance instead, so each has its own budget, is collected
  when it goes, and need not be hashable, while functions, class
  methods and static methods keep one shared cache as before.

  Next is **Synchronising calls**, where `wrapt.synchronized` puts a
  lock where it belongs: on the instance, the class or the function,
  depending on what it decorates.

  The "LRU Cache" section of the
  [bundled decorators guide](https://wrapt.readthedocs.io/en/latest/bundled.html)
  in the wrapt documentation covers `wrapt.lru_cache`, and
  [functools.lru_cache](https://docs.python.org/3/library/functools.html#functools.lru_cache)
  in Python's documentation covers the standard library one.
